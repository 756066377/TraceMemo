appId: com.tracememo.app
productName: NearCast
afterPack: scripts/after-pack.cjs
directories:
  buildResources: build
files:
  - out
  - '!**/.vscode/*'
  - '!src/*'
  - '!goutoujunshi-jev-chat/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraMetadata:
  main: out/main/index.js
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
  - node_modules/silk-wasm/**
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-*/**
  - node_modules/@napi-rs/system-ocr/**
  - node_modules/@napi-rs/system-ocr-*/**
extraResources:
  # Keep the updater provider in every packaged Windows app. electron-builder also
  # regenerates this file during publish, using the same release configuration.
  - from: build/app-update.yml
    to: app-update.yml
  # Keep only resources required by the Windows x64 runtime.
  - from: resources
    to: resources
    filter:
      - icon.png
      - daily_report_templates.html
      - mobile_daily_report.html
      - mobile_daily_report_v1.html
      - mobile_daily_report_v2.html
      - key/win32/x64/**
      - runtime/win32/**
      - wcdb/win32/x64/**
      - wechat-hook/**
      - reply-assistant/**
      - '!wcdb/**/tm-wcdb-config-helper*'
  # 默认不打包helper
  # - from: resources/wcdb/win32/x64
  #   to: resources/wcdb/win32/x64
  #   filter:
  #     - 'tm-wcdb-config-helper.exe'
  - from: docs/skill/tracememo-reader
    to: skill/tracememo-reader
    filter:
      - '**/*'
win:
  icon: icon.ico
  executableName: NearCast
  # 本机未开启 Windows 开发者模式时，winCodeSign 压缩包里的 macOS 符号链接无法解压。
  # 由 afterPack 使用 JS 编辑主程序图标与产品信息，避免调用该外部工具。
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: NearCast-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
# 保留六个常用 locale，既满足 Windows 包体积控制，也避免 electron-builder
# 一次删除 50 个语言文件触发宿主批量删除保护。
electronLanguages:
  - zh-CN
  - en-US
  - en-GB
  - ja
  - fr
  - de
publish:
  provider: github
  owner: 756066377
  repo: TraceMemo
  # 一律先上传为草稿 再到 GitHub 上手动 Publish。
  # 需要预发布时用 `pnpm release:beta`（EP_PRE_RELEASE 会覆盖这里的 draft）。
  releaseType: draft
